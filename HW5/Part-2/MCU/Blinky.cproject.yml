# A project translates into one executable or library.
project:

  # Project define
  define:
    - TF_LITE_STATIC_MEMORY # <--- FIXED: Prevents search for array.h
    - OS_IDLE_THREAD_NAME: \"Idle\"
    - OS_TIMER_THREAD_NAME: \"Timer\"

  add-path:
    - ./tflm
    - ./tflm/gemmlowp
    - ./flatbuffer
    - ./tflm/ruy
    - ./tflm/kissfft
    - ./tflm/signal

  # List components to use for your application.
  components:
    - component: Device:CubeMX
    - component: CMSIS:CORE
    - component: CMSIS:OS Tick:SysTick
    - component: CMSIS:RTOS2:Keil RTX5&Source
    - component: CMSIS-Compiler:CORE
    - component: CMSIS-Compiler:STDIN:Custom
    - component: CMSIS-Compiler:STDOUT:Custom
    - component: CMSIS-Compiler:STDERR:Custom
    - component: CMSIS Driver:GPIO
    - component: CMSIS Driver:USART
    - component: CMSIS Driver:VIO:Board
    - component: CMSIS:DSP&Source

  # List of source groups and files added to a project or a layer.
  groups:
    - group: Documentation
      files:
        - file: README.md

    - group: Source Files
      files:
        - file: KWS_TFLite.c
        - file: retarget_stdio.c
          define:
            - RETARGET_STDIO_UART: 1
        - file: kws_inference.cpp
        - file: mfcc.c
        - file: kws_scaler.c

    # TFLM Core files
    - group: TFLM Core
      files:
        - file: tflm/tensorflow/lite/micro/micro_interpreter.cc
        - file: tflm/tensorflow/lite/micro/micro_interpreter_context.cc
        - file: tflm/tensorflow/lite/micro/micro_interpreter_graph.cc
        - file: tflm/tensorflow/lite/micro/micro_allocator.cc
        - file: tflm/tensorflow/lite/micro/micro_allocation_info.cc
        - file: tflm/tensorflow/lite/micro/micro_context.cc
        - file: tflm/tensorflow/lite/micro/micro_log.cc
        - file: tflm/tensorflow/lite/micro/micro_profiler.cc
        - file: tflm/tensorflow/lite/micro/micro_resource_variable.cc
        - file: tflm/tensorflow/lite/micro/micro_utils.cc
        - file: tflm/tensorflow/lite/micro/system_setup.cc
        - file: tflm/tensorflow/lite/micro/memory_helpers.cc
        - file: tflm/tensorflow/lite/micro/flatbuffer_utils.cc
        - file: tflm/tensorflow/lite/micro/memory_planner/linear_memory_planner.cc
        - file: tflm/tensorflow/lite/micro/memory_planner/greedy_memory_planner.cc
        - file: tflm/tensorflow/lite/micro/arena_allocator/single_arena_buffer_allocator.cc
        - file: tflm/tensorflow/lite/micro/arena_allocator/non_persistent_arena_buffer_allocator.cc
        - file: tflm/tensorflow/lite/micro/arena_allocator/persistent_arena_buffer_allocator.cc
        - file: tflm/tensorflow/lite/micro/tflite_bridge/micro_error_reporter.cc
        - file: tflm/tensorflow/lite/micro/tflite_bridge/flatbuffer_conversions_bridge.cc
        - file: tflm/tensorflow/lite/micro/micro_time.cc
        - file: tflm/tensorflow/lite/micro/debug_log.cc
        - file: tflm/tensorflow/lite/micro/micro_op_resolver.cc

    # TFLM Kernels (Updated for your 2D Conv Model)
# TFLM Kernels
    # TFLM Kernels (CORRECTED)
    - group: TFLM Kernels
      files:
        - file: tflm/tensorflow/lite/micro/kernels/activations.cc
        - file: tflm/tensorflow/lite/micro/kernels/activations_common.cc
        - file: tflm/tensorflow/lite/micro/kernels/pooling.cc
        - file: tflm/tensorflow/lite/micro/kernels/pooling_common.cc
        - file: tflm/tensorflow/lite/micro/kernels/conv.cc
        - file: tflm/tensorflow/lite/micro/kernels/conv_common.cc
        - file: tflm/tensorflow/lite/micro/kernels/fully_connected.cc
        - file: tflm/tensorflow/lite/micro/kernels/fully_connected_common.cc
        - file: tflm/tensorflow/lite/micro/kernels/softmax.cc
        - file: tflm/tensorflow/lite/micro/kernels/softmax_common.cc
        - file: tflm/tensorflow/lite/micro/kernels/reshape.cc
        - file: tflm/tensorflow/lite/micro/kernels/reshape_common.cc
        - file: tflm/tensorflow/lite/micro/kernels/prelu.cc
        - file: tflm/tensorflow/lite/micro/kernels/prelu_common.cc
        - file: tflm/tensorflow/lite/micro/kernels/shape.cc
        # --- ADD THESE 4 FILES NOW ---
        - file: tflm/tensorflow/lite/micro/kernels/quantize.cc
        - file: tflm/tensorflow/lite/micro/kernels/quantize_common.cc
        - file: tflm/tensorflow/lite/micro/kernels/dequantize.cc
        - file: tflm/tensorflow/lite/micro/kernels/dequantize_common.cc
        # -----------------------------
        - file: tflm/tensorflow/lite/micro/kernels/kernel_util.cc
        - file: tflm/tensorflow/lite/micro/kernels/micro_tensor_utils.cc
        - file: tflm/tensorflow/lite/micro/kernels/depthwise_conv.cc
        - file: tflm/tensorflow/lite/micro/kernels/depthwise_conv_common.cc
        - file: tflm/tensorflow/lite/micro/kernels/pad.cc
        - file: tflm/tensorflow/lite/micro/kernels/add.cc
        - file: tflm/tensorflow/lite/micro/kernels/add_common.cc
        - file: tflm/tensorflow/lite/micro/kernels/strided_slice.cc        # ADD THIS
        - file: tflm/tensorflow/lite/micro/kernels/strided_slice_common.cc # ADD THIS
        - file: tflm/tensorflow/lite/micro/kernels/mul.cc
        - file: tflm/tensorflow/lite/micro/kernels/mul_common.cc        # <--- ADD THIS NOW
        - file: tflm/tensorflow/lite/micro/kernels/pack.cc
  
        

    # TFLite Core (Removed standard kernel_util.cc to avoid conflict)
    - group: TFLite Core
      files:
        - file: tflm/tensorflow/lite/core/api/error_reporter.cc
        - file: tflm/tensorflow/lite/core/api/flatbuffer_conversions.cc
        - file: tflm/tensorflow/lite/core/api/tensor_utils.cc
        - file: tflm/tensorflow/lite/core/c/common.cc
        - file: tflm/tensorflow/lite/kernels/internal/quantization_util.cc
        - file: tflm/tensorflow/lite/kernels/internal/portable_tensor_utils.cc
        - file: tflm/tensorflow/lite/kernels/internal/common.cc
        - file: tflm/tensorflow/lite/kernels/internal/reference/portable_tensor_utils.cc
        - file: tflm/tensorflow/lite/schema/schema_utils.cc

  linker:
    - script: ./RTE/Device/STM32F746NGHx/ac6_linker_script.sct.src
      regions: ./RTE/Device/STM32F746NGHx/regions_STM32F746G-DISCO.h
      for-compiler: AC6

  # List executable file formats to be generated.
  output:
    type:
      - elf
      - hex
      - map
